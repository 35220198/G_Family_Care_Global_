<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G.Family Care — Local Password Hash Generator</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:20px}input,button,textarea{width:100%;padding:12px;margin:8px 0;font:inherit}button{cursor:pointer}textarea{height:120px}</style></head>
<body><h1>Password Hash Generator</h1>
<p>Use this file locally. Do not publish it or enter your real password on a public website.</p>
<input id="p" type="password" minlength="12" placeholder="Choose a strong admin password">
<button id="go">Generate PBKDF2 hash</button><textarea id="out" readonly placeholder="Your hash will appear here"></textarea>
<script>
const enc=new TextEncoder(); const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
document.getElementById('go').onclick=async()=>{
 const p=document.getElementById('p').value, out=document.getElementById('out');
 if(p.length<12){out.value='Password must be at least 12 characters.';return}
 const salt=crypto.getRandomValues(new Uint8Array(16)), iterations=150000;
 const key=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},key,256));
 out.value=`pbkdf2$${iterations}$${hex(salt)}$${hex(bits)}`;
};
</script></body></html>
