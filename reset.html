<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G.Family Care — Password Reset</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head><body class="min-h-screen bg-gradient-to-br from-emerald-950 via-emerald-800 to-emerald-600 flex items-center justify-center p-5" style="font-family:Poppins,Arial,sans-serif"><main class="w-full max-w-md bg-white/95 backdrop-blur rounded-3xl p-8 shadow-2xl"><a href="/admin/" class="inline-flex items-center gap-2 text-emerald-800 font-bold mb-8"><i class="fas fa-arrow-left"></i> Admin login</a><h1 class="text-2xl font-extrabold text-slate-900">Reset administrator password</h1><p class="text-sm text-slate-500 mt-2 mb-7">Enter the company email to receive a secure reset link.</p><form id="request" class="space-y-4"><input id="email" type="email" required placeholder="info@gfamilycare.com" class="w-full rounded-xl border border-slate-200 px-4 py-3"><button class="w-full rounded-xl bg-emerald-700 text-white font-bold py-3">Send reset email</button><p id="status" class="text-sm text-center" aria-live="polite"></p></form><div id="change" class="hidden mt-8 border-t pt-7"><h2 class="font-bold text-lg">Choose a new password</h2><p class="text-xs text-slate-500 mt-1">At least 12 characters.</p><form id="reset" class="space-y-4 mt-4"><input id="newpass" type="password" minlength="12" required placeholder="New password" class="w-full rounded-xl border border-slate-200 px-4 py-3"><input id="confirm" type="password" minlength="12" required placeholder="Confirm new password" class="w-full rounded-xl border border-slate-200 px-4 py-3"><button class="w-full rounded-xl bg-emerald-700 text-white font-bold py-3">Update password</button><p id="resetstatus" class="text-sm text-center" aria-live="polite"></p></form></div></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),request=document.getElementById('request'),change=document.getElementById('change');if(token){request.classList.add('hidden');change.classList.remove('hidden')}request.onsubmit=async e=>{e.preventDefault();const st=document.getElementById('status');st.textContent='Sending…';try{const r=await fetch('/.netlify/functions/auth?action=forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();if(!r.ok)throw Error(d.error);st.textContent=d.message;st.className='text-sm text-center text-emerald-700 font-semibold'}catch(err){st.textContent=err.message;st.className='text-sm text-center text-red-600 font-semibold'}};document.getElementById('reset').onsubmit=async e=>{e.preventDefault();const st=document.getElementById('resetstatus');if(newpass.value!==confirm.value){st.textContent='Passwords do not match.';st.className='text-sm text-center text-red-600 font-semibold';return}st.textContent='Updating…';try{const r=await fetch('/.netlify/functions/auth?action=reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:newpass.value})});const d=await r.json();if(!r.ok)throw Error(d.error);st.textContent=d.message;st.className='text-sm text-center text-emerald-700 font-semibold';setTimeout(()=>location.href='/admin/',1200)}catch(err){st.textContent=err.message;st.className='text-sm text-center text-red-600 font-semibold'}};</script></body></html>
