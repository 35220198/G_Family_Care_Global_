<!-- Back to main website -->
<a
  href="../"
  class="inline-flex items-center gap-2 text-emerald-800 font-bold mb-8"
>
  <i class="fas fa-arrow-left"></i>
  Back to website
</a>

<!-- Logo / heading -->
<div class="text-center mb-8">

  <div class="mx-auto w-16 h-16 rounded-2xl bg-emerald-700 text-white grid place-items-center text-2xl shadow-lg">
    <i class="fas fa-shield-halved"></i>
  </div>

  <h1 class="text-2xl font-extrabold text-slate-900 mt-4">
    Administrator Login
  </h1>

  <p class="text-sm text-slate-500 mt-2">
    G.Family Home Care Services
  </p>

</div>

<!-- Login form -->
<form id="loginForm" class="space-y-5">

  <!-- Email -->
  <label class="block">

    <span class="text-xs font-bold uppercase tracking-wide text-slate-600">
      Company email
    </span>

    <input
      id="email"
      type="email"
      autocomplete="username"
      required
      class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-4 focus:ring-emerald-100"
      placeholder="info@gfamilycare.com"
    >

  </label>

  <!-- Password -->
  <label class="block">

    <span class="text-xs font-bold uppercase tracking-wide text-slate-600">
      Password
    </span>

    <div class="relative mt-2">

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        class="w-full rounded-xl border border-slate-200 px-4 py-3 pr-12 outline-none focus:ring-4 focus:ring-emerald-100"
      >

      <button
        type="button"
        id="showPassword"
        class="absolute right-3 top-3 text-slate-400"
        aria-label="Show password"
      >
        <i class="fas fa-eye"></i>
      </button>

    </div>

  </label>

  <!-- Login button -->
  <button
    type="submit"
    class="w-full rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 shadow-lg"
  >
    Sign in
    <i class="fas fa-arrow-right ml-1"></i>
  </button>

  <!-- Status -->
  <p
    id="status"
    class="text-sm text-center"
    aria-live="polite"
  ></p>

</form>

<!-- Reset -->
<div class="text-center mt-6">

  <a
    href="reset.html"
    class="text-sm font-semibold text-emerald-700 hover:text-emerald-900"
  >
    Forgot password?
  </a>

</div>
