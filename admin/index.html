<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G.Family Care — Admin Login</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>body{font-family:Poppins,Arial,sans-serif}.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(18px);box-shadow:0 25px 70px rgba(2,44,34,.14)}</style></head><body class="min-h-screen bg-gradient-to-br from-emerald-950 via-emerald-800 to-emerald-600 flex items-center justify-center p-5"><main class="w-full max-w-md glass rounded-3xl p-8"><a href="/" class="inline-flex items-center gap-2 text-emerald-800 font-bold mb-8"><i class="fas fa-arrow-left"></i> Back to website</a><div class="text-center mb-8"><div class="mx-auto w-16 h-16 rounded-2xl bg-emerald-700 text-white grid place-items-center text-2xl shadow-lg"><i class="fas fa-shield-halved"></i></div><h1 class="text-2xl font-extrabold text-slate-900 mt-4">Administrator Login</h1><p class="text-sm text-slate-500 mt-2">G.Family Home Care Services</p></div><form id="login" class="space-y-5"><label class="block"><span class="text-xs font-bold uppercase tracking-wide text-slate-600">Company email</span><input id="email" type="email" autocomplete="username" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-4 focus:ring-emerald-100" placeholder="info@gfamilycare.com"></label><label class="block"><span class="text-xs font-bold uppercase tracking-wide text-slate-600">Password</span><div class="relative mt-2"><input id="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-200 px-4 py-3 pr-12 outline-none focus:ring-4 focus:ring-emerald-100"><button type="button" id="show" class="absolute right-3 top-3 text-slate-400"><i class="fas fa-eye"></i></button></div></label><button class="w-full rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 shadow-lg" type="submit">Sign in <i class="fas fa-arrow-right ml-1"></i></button><p id="status" class="text-sm text-center" aria-live="polite"></p></form><div class="text-center mt-6"><a href="/admin/reset.html" class="text-sm font-semibold text-emerald-700 hover:text-emerald-900">Forgot password?</a></div></main><script>const f=document.getElementById('login'),s=document.getElementById('status');document.getElementById('show').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'};f.addEventListener('submit',async e=>{e.preventDefault();s.textContent='Signing in…';s.className='text-sm text-center text-slate-500';try{const r=await fetch('/.netlify/functions/auth?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');location.href='/admin/dashboard.html'}catch(err){s.textContent=err.message;s.className='text-sm text-center text-red-600 font-semibold'}});</script></body></html>
