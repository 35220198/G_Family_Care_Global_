<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G.Family Care — Admin Login</title>
<link rel="stylesheet" href="/css/admin.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head><body class="admin-login">
<main class="glass login-card">
<a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to website</a>
<div class="login-brand"><div class="shield"><i class="fas fa-shield-halved"></i></div>
<h1>Administrator Login</h1><p class="muted">G.Family Home Care Services</p></div>
<form id="login">
<label class="form-group"><span>Company email</span><input id="email" type="email" autocomplete="username" required placeholder="info@gfamilycare.com"></label>
<label class="form-group"><span>Password</span><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="show" class="show-password" aria-label="Show password"><i class="fas fa-eye"></i></button></div></label>
<button class="primary-btn" type="submit">Sign in <i class="fas fa-arrow-right"></i></button><p id="status" class="status" aria-live="polite"></p>
</form><div class="forgot"><a href="/admin/reset.html">Forgot password?</a></div>
</main><script src="/js/admin-login.js" defer></script></body></html>
